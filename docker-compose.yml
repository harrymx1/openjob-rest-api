version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: openjob-redis
    ports:
      - '6379:6379'
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: openjob-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672' # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always
